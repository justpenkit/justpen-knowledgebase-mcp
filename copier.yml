_min_copier_version: "9.18.2"
_subdirectory: template

_envops:
  keep_trailing_newline: true
  undefined: jinja2.StrictUndefined

project_name:
  type: str
  default: example-mcp
  help: Lowercase repository name ending in -mcp (for example weather-mcp).
  validator: >-
    {% if not (project_name | regex_search('\\A[a-z][a-z0-9]*(?:-[a-z0-9]+)*-mcp\\Z')) %}
    project_name must use lowercase words separated by single hyphens and end in -mcp.
    {% endif %}

repo_owner:
  type: str
  default: justpenkit
  help: GitHub user or organization that owns the new repository.
  validator: >-
    {% if not (repo_owner | regex_search('\\A[A-Za-z0-9](?:[A-Za-z0-9-]{0,37}[A-Za-z0-9])?\\Z')) %}
    repo_owner must be a valid GitHub user or organization name.
    {% endif %}

description:
  type: str
  default: "MCP server for {{ project_name }}."
  help: A short description of what the server does.

author:
  type: str
  default: "{{ repo_owner }}"
  help: Package author and MIT copyright holder.

copyright_year:
  type: int
  default: "{{ '%Y' | strftime }}"
  help: First copyright year (saved for future updates).
  validator: "{% if copyright_year < 2000 or copyright_year > 9999 %}Use a four-digit year from 2000 onward.{% endif %}"

package_name:
  type: str
  default: "{{ project_name | replace('-', '_') }}"
  when: false
  validator: >-
    {% if package_name != (project_name | replace('-', '_')) %}
    package_name is derived from project_name and cannot be overridden.
    {% endif %}

initial_version:
  type: str
  # Copier exposes PurePath, so escape glob syntax before probing the file.
  default: >-
    {{ '0.1.0' if ((_copier_conf.dst_path / _copier_conf.answers_file) | string |
       replace('[', '[[]') | replace('?', '[?]') | replace('*', '[*]') | fileglob) else '0.0.0' }}
  help: Initial version baseline; keep the default when creating or updating a project.

_message_after_copy: |
  Created {{ project_name }} with Claude Code and Codex development support.
  Run `git init` (if needed), then `make setup` and `make check`.
  Commit uv.lock and .copier-answers.yml with your project.

_message_after_update: |-
  Review `git diff` and resolve any conflicts before running `uv lock` and `make check`.
  Direct metadata changes still require user approval when using a coding agent.
