default_install_hook_types: [pre-commit, pre-push, commit-msg]
default_stages: [pre-commit]
fail_fast: false

repos:
  - repo: local
    hooks:
      - id: merge-conflict-check
        name: Reject staged conflict markers and whitespace errors
        entry: git diff --cached --check
        language: system
        pass_filenames: false
        always_run: true
      - id: lint-fix
        name: make lint-fix
        entry: make lint-fix
        language: system
        types: [python]
        pass_filenames: false
      - id: format
        name: make format
        entry: make format
        language: system
        types: [text]
        pass_filenames: false
      - id: typecheck
        name: make typecheck (active Python)
        entry: make typecheck
        language: system
        types: [python]
        pass_filenames: false
      - id: lock-check
        name: make lock-check
        entry: make lock-check
        language: system
        files: ^(pyproject\.toml|uv\.lock)$
        pass_filenames: false
      - id: check
        name: make check
        entry: make check
        language: system
        stages: [pre-push]
        always_run: true
        pass_filenames: false

      - id: docs-build
        name: make docs-build
        entry: make docs-build
        language: system
        stages: [pre-push]
        always_run: true
        pass_filenames: false

      - id: conventional-commit
        name: Conventional Commits (Commitizen)
        entry: uv run --locked --group dev cz -n cz_customize check --commit-msg-file
        language: system
        stages: [commit-msg]
