site_name: "justpen-knowledgebase-mcp"
site_description: "Knowledge base MCP for justpen pentesting framework"
site_url: https://justpen-knowledgebase-mcp.justpenkit.justmumu.com/
repo_url: https://github.com/justpenkit/justpen-knowledgebase-mcp
repo_name: justpenkit/justpen-knowledgebase-mcp
edit_uri: ''

hooks:
  - scripts/docs_version.py

theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/favicon.svg
  palette:
    - media: '(prefers-color-scheme: light)'
      scheme: default
      primary: deep purple
      accent: deep purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: '(prefers-color-scheme: dark)'
      scheme: slate
      primary: deep purple
      accent: deep purple
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy

nav:
  - Home: index.md
  - Quickstart: quickstart.md
  - Guides:
      - Workspace and operations: guides/workspace.md
      - Recon graph: guides/graph.md
      - Evidence and search: guides/evidence-search.md
      - Telemetry: guides/telemetry.md
  - Tool reference:
      - Overview: tools/index.md
      - Graph and search: tools/graph.md
      - Evidence: tools/evidence.md
      - Maintenance: tools/maintenance.md
  - Contributing:
      - Getting started: contributing/getting-started.md
      - Claude Code and Codex: contributing/agents.md
      - Pre-PR checklist: contributing/pr-checklist.md
      - Lint & typing: contributing/lint-typing.md
      - Release process: contributing/release-process.md
      - Template updates: contributing/template-updates.md

plugins:
  - search

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences

validation:
  nav:
    omitted_files: warn
    not_found: warn
    absolute_links: warn
  links:
    not_found: warn
    anchors: warn
    absolute_links: warn
    unrecognized_links: warn
