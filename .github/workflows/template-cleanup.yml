name: Initial project setup

on:
  push:

permissions:
  contents: write

concurrency:
  group: initial-project-setup
  cancel-in-progress: false

jobs:
  cleanup:
    if: ${{ !github.event.repository.is_template && github.repository != 'justpenkit/justpen-mcp-dev-template' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      UV_PYTHON: "3.13"
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Sentinel check (skip if already cleaned)
        id: sentinel
        run: |
          if [ ! -f .github/.template-pending ]; then
            echo "Sentinel missing — template cleanup already ran, skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install uv
        if: steps.sentinel.outputs.skip == 'false'
        uses: astral-sh/setup-uv@v10.0.1

      - name: Install Python 3.13
        if: steps.sentinel.outputs.skip == 'false'
        run: uv python install 3.13

      - name: Generate and verify project with Copier
        if: steps.sentinel.outputs.skip == 'false'
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          PROJECT_DESCRIPTION: ${{ github.event.repository.description }}
          PROJECT_AUTHOR: ${{ github.repository_owner }}
        run: |
          uv run --locked python scripts/bootstrap.py

      - name: Commit and push
        if: steps.sentinel.outputs.skip == 'false'
        run: |-
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name  "github-actions[bot]"
          git add -A
          git commit -m "chore: initial template setup"
          git push
