name: Publish documentation

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: false

jobs:
  deploy-docs:
    name: Publish documentation
    if: >-
      github.repository == 'justpenkit/justpen-mcp-dev-template' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == 'main'
    environment:
      name: production
      url: https://justpen-mcp-dev-template.justpenkit.justmumu.com/
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      deployments: write
    env:
      UV_PYTHON: '3.13'
      DOCS_COMMIT: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Check publishing credentials
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo '::error::Set CLOUDFLARE_ACCOUNT_ID and CLOUDFLARE_API_TOKEN in repository Settings > Secrets and variables > Actions.'
            exit 1
          fi
      - name: Check out the successful CI commit
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - name: Install Python
        run: uv python install "$UV_PYTHON"
      - name: Require the committed lockfile
        run: make lock-check
      - name: Install locked dependencies
        run: make install
      - name: Build documentation
        run: make docs-build
      - name: Require current main before publication
        run: |
          git fetch --no-tags --depth=1 origin main
          if [ "$(git rev-parse FETCH_HEAD)" != "$DOCS_COMMIT" ]; then
            echo '::error::A newer main commit exists. Publish that commit instead.'
            exit 1
          fi
      - name: Publish to Cloudflare Pages
        id: pages
        uses: cloudflare/wrangler-action@v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=justpen-mcp-dev-template --branch=main --commit-hash=${{ github.event.workflow_run.head_sha }}
      - name: Verify production deployment
        env:
          PAGES_ENVIRONMENT: ${{ steps.pages.outputs.pages-environment }}
        run: |-
          if [ "$PAGES_ENVIRONMENT" != 'production' ]; then
            echo '::error::Pages did not report a production deployment. Set the Pages production branch to main before retrying.'
            exit 1
          fi
