name: Release

on:
  push:
    tags: ["v[0-9]*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    name: Validate release from main
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      notes: ${{ steps.notes.outputs.notes }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.1.0
      - name: Install Python
        run: uv python install 3.13
      - name: Validate release and extract its changelog section
        id: notes
        run: |
          uv run --no-project --python 3.13 python scripts/release.py notes \
            --tag "$GITHUB_REF_NAME" --output "$RUNNER_TEMP/release-notes.md"
          notes=$(base64 < "$RUNNER_TEMP/release-notes.md" | tr -d '\n')
          printf 'notes=%s\n' "$notes" >> "$GITHUB_OUTPUT"

  release:
    name: Create GitHub Release
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_NOTES: ${{ needs.validate.outputs.notes }}
        run: |-
          printf '%s' "$RELEASE_NOTES" | base64 --decode > "$RUNNER_TEMP/release-notes.md"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists."
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag \
              --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
