name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: quality
    outputs:
      generated: ${{ steps.project.outputs.generated }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      UV_PYTHON: "3.13"
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - name: Install Python
        run: uv python install "$UV_PYTHON"
      - name: Select integration owner
        id: project
        run: |
          if [ -f copier.yml ]; then
            echo "generated=false" >> "$GITHUB_OUTPUT"
          else
            echo "generated=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Require the committed lockfile
        run: make lock-check
      - name: make install
        run: make install
      - name: Shared formatting and lint
        run: make check-static
      - name: Strict documentation build
        run: make docs-build

  check:
    name: check (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - name: Install Python
        run: uv python install "$UV_PYTHON"
      - name: Require the committed lockfile
        run: make lock-check
      - name: make install
        run: make install
      - name: Active Python typing and unit tests
        run: make check-python

  integration:
    name: integration
    needs: quality
    if: needs.quality.outputs.generated == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      UV_PYTHON: "3.13"
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - name: Install Python
        run: uv python install "$UV_PYTHON"
      - name: Require the committed lockfile
        run: make lock-check
      - name: make install
        run: make install
      - name: Install native audit prerequisite
        run: sudo apt-get update && sudo apt-get install -y strace
      - name: Real tool, release and documentation scenarios
        run: make test-integration

  consumer-runtime:
    name: consumer/runtime (${{ matrix.runner }}, py${{ matrix.python }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, macos-15-intel]
        python: ["3.11", "3.12", "3.13"]
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - name: Install active Python
        run: uv python install "$UV_PYTHON"
      - name: Install native Linux audit prerequisite
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y strace
      - name: Native cold-start confinement including telemetry
        run: make test-native
      - name: Isolated locked and minimum wheel consumers
        run: make test-consumer
      - name: Record actual runtime architecture
        run: uv run --no-project python -c 'import platform; print(platform.platform(), platform.machine())'
